version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: data_lake_minio
    ports:
      - "9000:9000" # پورتی که پایتون از طریق آن با MinIO ارتباط برقرار می‌کند (API)
      - "9001:9001" # پورت رابط کاربری تحت وب (UI)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
