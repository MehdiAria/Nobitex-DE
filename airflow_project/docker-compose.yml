version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: airflow_init
    command: bash -c 'airflow version && python -c "import psycopg2; conn = psycopg2.connect(host="'"'"'postgres'"'"'", database="'"'"'airflow'"'"'", user="'"'"'airflow'"'"'", password="'"'"'airflow'"'"'"); cursor = conn.cursor(); cursor.execute("'"'"'TRUNCATE TABLE session CASCADE;'"'"'"); conn.commit(); cursor.close(); conn.close()" || true'
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key_12345
      # کوتیشن‌ها حذف شدند و نسخه فیکس شد
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas psycopg2-binary boto3
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    depends_on:
      - postgres
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-webserver:
    image: apache/airflow:2.9.1
    restart: always
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key_12345
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas psycopg2-binary boto3
    depends_on:
      - airflow-init
    volumes:
      - ./dags:/opt/airflow/dags

  airflow-scheduler:
    image: apache/airflow:2.9.1
    restart: always
    container_name: airflow_scheduler
    command: scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key_12345
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas psycopg2-binary boto3
    depends_on:
      - airflow-init
    volumes:
      - ./dags:/opt/airflow/dags

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_dashboard
    restart: always
    ports:
      - "3000:3001"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: airflow
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
    depends_on:
      - postgres

  streamlit:
    image: python:3.10-slim
    container_name: python_dashboard
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./dags:/app
    depends_on:
      - postgres

    command: >
      bash -c "pip install streamlit pandas psycopg2-binary  && streamlit run /app/dashboard.py --server.port=8501 --server.address=0.0.0.0"

  minio:
    image: minio/minio:latest
    container_name: data_lake_minio
    ports:
      - "9000:9000" # پورتی که پایتون از طریق آن با MinIO ارتباط برقرار می‌کند (API)
      - "9001:9001" # پورت رابط کاربری تحت وب (UI)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data


volumes:
  postgres_data:

  minio_data:
